naftiko: "1.0.0-alpha1"

info:
  label: "Science Museum Group Collection API"
  description: >-
    JSONAPI-compliant REST API providing open access to the Science Museum Group's
    collection of over 7 million objects, people, and documents across five UK
    museums. Supports full-text search, filtering by date, place, museum, and
    category, and individual resource retrieval.
  tags:
    - Museums
    - Collections
    - Cultural Heritage
    - Open Data
    - Science
    - United Kingdom
  created: "2026-05-02"
  modified: "2026-05-02"

capability:
  consumes:
    - type: http
      namespace: smg-collection
      baseUri: https://collection.sciencemuseumgroup.org.uk
      description: "Science Museum Group Collection API - open access, no authentication required"
      resources:
        - name: search-all
          path: /search
          description: "Full-text and filtered search across all collection types"
          operations:
            - name: search-all-collection
              method: GET
              description: "Search all objects, people, and documents in the collection"
              inputParameters:
                - name: q
                  in: query
                  type: string
                  required: false
                  description: "Full-text search query term"
                - name: page[number]
                  in: query
                  type: integer
                  required: false
                  description: "Zero-indexed page number"
                - name: page[size]
                  in: query
                  type: integer
                  required: false
                  description: "Results per page (max 100)"
                - name: date[from]
                  in: query
                  type: string
                  required: false
                  description: "Filter from date"
                - name: date[to]
                  in: query
                  type: string
                  required: false
                  description: "Filter to date"
                - name: places
                  in: query
                  type: string
                  required: false
                  description: "Filter by geographical association"
                - name: images
                  in: query
                  type: boolean
                  required: false
                  description: "Filter to items with images"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: search-objects
          path: /search/objects
          description: "Search physical objects and artifacts in the collection"
          operations:
            - name: search-objects
              method: GET
              description: "Search collection objects with filtering by type, maker, museum, category, and display status"
              inputParameters:
                - name: q
                  in: query
                  type: string
                  required: false
                  description: "Search query"
                - name: type
                  in: query
                  type: string
                  required: false
                  description: "Object type filter"
                - name: makers
                  in: query
                  type: string
                  required: false
                  description: "Filter by maker or manufacturer"
                - name: museum
                  in: query
                  type: string
                  required: false
                  description: "Filter by museum code (NRM, SMG, NMeM, MSI)"
                - name: on_display
                  in: query
                  type: boolean
                  required: false
                  description: "Filter to objects on display"
                - name: categories
                  in: query
                  type: string
                  required: false
                  description: "Filter by collection category"
                - name: places
                  in: query
                  type: string
                  required: false
                  description: "Filter by geographical association"
                - name: images
                  in: query
                  type: boolean
                  required: false
                  description: "Filter to objects with images"
                - name: page[number]
                  in: query
                  type: integer
                  required: false
                  description: "Zero-indexed page number"
                - name: page[size]
                  in: query
                  type: integer
                  required: false
                  description: "Results per page"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: search-people
          path: /search/people
          description: "Search people associated with the museum collections"
          operations:
            - name: search-people
              method: GET
              description: "Search for scientists, engineers, makers and historical figures in the collection"
              inputParameters:
                - name: q
                  in: query
                  type: string
                  required: false
                  description: "Search query"
                - name: occupation
                  in: query
                  type: string
                  required: false
                  description: "Filter by occupation"
                - name: birth[place]
                  in: query
                  type: string
                  required: false
                  description: "Filter by birth place"
                - name: birth[date]
                  in: query
                  type: string
                  required: false
                  description: "Filter by birth date"
                - name: places
                  in: query
                  type: string
                  required: false
                  description: "Filter by geographical association"
                - name: page[number]
                  in: query
                  type: integer
                  required: false
                  description: "Zero-indexed page number"
                - name: page[size]
                  in: query
                  type: integer
                  required: false
                  description: "Results per page"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: search-documents
          path: /search/documents
          description: "Search documents and archives in the collection"
          operations:
            - name: search-documents
              method: GET
              description: "Search for documents, archives, and written records"
              inputParameters:
                - name: q
                  in: query
                  type: string
                  required: false
                  description: "Search query"
                - name: makers
                  in: query
                  type: string
                  required: false
                  description: "Filter by document creator"
                - name: people
                  in: query
                  type: string
                  required: false
                  description: "Filter by associated person"
                - name: archive
                  in: query
                  type: string
                  required: false
                  description: "Filter by archive reference"
                - name: page[number]
                  in: query
                  type: integer
                  required: false
                  description: "Zero-indexed page number"
                - name: page[size]
                  in: query
                  type: integer
                  required: false
                  description: "Results per page"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: objects
          path: /objects/{id}
          description: "Retrieve individual collection objects by ID"
          operations:
            - name: get-object
              method: GET
              description: "Retrieve a single collection object with full metadata, images, and relationships"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Collection object identifier (e.g., co26704)"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: people
          path: /people/{id}
          description: "Retrieve individual person records by ID"
          operations:
            - name: get-person
              method: GET
              description: "Retrieve a single person record with biographical data and image references"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Person identifier (e.g., cp22644)"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: documents
          path: /documents/{id}
          description: "Retrieve individual document records by ID"
          operations:
            - name: get-document
              method: GET
              description: "Retrieve a single document record with metadata and archive location"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Document identifier (e.g., cd23456)"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: smg-collection-api
      resources:
        - path: /v1/search
          name: search-all
          description: "Search all collection types"
          operations:
            - method: GET
              name: search-all-collection
              description: "Full-text search across objects, people, and documents"
              call: "smg-collection.search-all-collection"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/objects
          name: search-objects
          description: "Search collection objects"
          operations:
            - method: GET
              name: search-objects
              description: "Search physical objects and artifacts"
              call: "smg-collection.search-objects"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/objects/{id}
          name: get-object
          description: "Get a single collection object"
          operations:
            - method: GET
              name: get-object
              description: "Retrieve object by ID"
              call: "smg-collection.get-object"
              with:
                id: "rest.id"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/people
          name: search-people
          description: "Search collection people"
          operations:
            - method: GET
              name: search-people
              description: "Search for people in the collection"
              call: "smg-collection.search-people"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/people/{id}
          name: get-person
          description: "Get a single person record"
          operations:
            - method: GET
              name: get-person
              description: "Retrieve person by ID"
              call: "smg-collection.get-person"
              with:
                id: "rest.id"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/documents
          name: search-documents
          description: "Search collection documents"
          operations:
            - method: GET
              name: search-documents
              description: "Search for documents and archives"
              call: "smg-collection.search-documents"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/documents/{id}
          name: get-document
          description: "Get a single document record"
          operations:
            - method: GET
              name: get-document
              description: "Retrieve document by ID"
              call: "smg-collection.get-document"
              with:
                id: "rest.id"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: smg-collection-mcp
      transport: http
      tools:
        - name: search-all-collection
          description: "Search all Science Museum Group collection types"
          hints:
            readOnly: true
            openWorld: true
          call: "smg-collection.search-all-collection"
          outputParameters:
            - type: object
              mapping: "$."

        - name: search-objects
          description: "Search physical objects and artifacts in the Science Museum Group collection"
          hints:
            readOnly: true
            openWorld: true
          call: "smg-collection.search-objects"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-object
          description: "Retrieve a specific collection object by its ID"
          hints:
            readOnly: true
            idempotent: true
          call: "smg-collection.get-object"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."

        - name: search-people
          description: "Search for scientists, engineers, and historical figures in the collection"
          hints:
            readOnly: true
            openWorld: true
          call: "smg-collection.search-people"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-person
          description: "Retrieve a specific person record by ID"
          hints:
            readOnly: true
            idempotent: true
          call: "smg-collection.get-person"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."

        - name: search-documents
          description: "Search for documents and archives in the collection"
          hints:
            readOnly: true
            openWorld: true
          call: "smg-collection.search-documents"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-document
          description: "Retrieve a specific document by ID"
          hints:
            readOnly: true
            idempotent: true
          call: "smg-collection.get-document"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."

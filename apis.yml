name: Science Museum Group
description: >-
  The Science Museum Group operates five UK science and technology museums: the Science Museum (London), the Science and
  Industry Museum (Manchester), the National Railway Museum (York), the National Science and Media Museum (Bradford),
  and Locomotion (Shildon). The group provides an open Collection API giving developers programmatic access to over 7
  million objects, people, and documents in the museum collections via a JSONAPI-compliant REST interface. The API is
  free to use and supports searching, filtering, and retrieval of collection items with rich metadata, images, and
  curatorial notes.
